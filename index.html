<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"/>
    <meta name="referrer" content="no-referrer"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#1a1a2e"/>
    <title>Coser 资源合集 - tp34.cn</title>
    <style>
        #loadingOverlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center;
            z-index: 100000; font-size: 1.2rem; color: #5a3d8a; backdrop-filter: blur(4px);
        }
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
            z-index: 10000; display: flex; align-items: center; justify-content: center; padding:20px;
            opacity:0; visibility:hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.active { opacity:1; visibility:visible; }
        .modal-dialog {
            background: #fff; border-radius:24px; max-width:360px; width:100%; padding:28px 22px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; color: #2d2d3a;
        }
        .modal-dialog .modal-icon { font-size:2.8rem; margin-bottom:8px; }
        .modal-dialog .modal-title { font-weight:700; font-size:1.2rem; color:#1a1a2e; margin-bottom:14px; }
        .modal-dialog .modal-content { font-size:0.88rem; color:#4a4a5e; line-height:1.7; margin-bottom:20px; }
        .line-btn {
            display: block; width:100%; margin:8px 0; padding:12px;
            background: #f0eaf8; border:1px solid #d5c8e8; border-radius:12px;
            font-size:0.9rem; cursor:pointer; transition: background 0.2s;
        }
        .line-btn:hover { background: #e4d8f5; }
        .modal-close-btn {
            background: #e8618c; border:none; color:#fff; font-weight:700; font-size:0.95rem;
            padding:12px 28px; border-radius:30px; cursor:pointer; box-shadow:0 4px 14px rgba(232,97,140,0.35);
            margin-top:10px;
        }
    </style>
</head>
<body>
<div id="loadingOverlay">⏳ 正在加载，请稍候...</div>

<div class="modal-overlay" id="lineModal">
    <div class="modal-dialog">
        <div class="modal-icon">🔄</div>
        <div class="modal-title">主服务器加载失败 / 超时</div>
        <div class="modal-content">
            <p>请选择备用线路加载主程序：</p>
            <button class="line-btn" data-url="https://cdn.jsdelivr.net/gh/getaAAAs/test@main/1.4/app.js?v=1.0.4">🌍 备用线路一 (v1.4)</button>
            <button class="line-btn" data-url="https://cdn.jsdelivr.net/gh/getaAAAs/test@main/1.3/app.js?v=1.0.3">🌍 备用线路二 (v1.3)</button>
			<button class="line-btn" data-url="https://fastly.jsdelivr.net/gh/getaAAAs/test@main/1.3/app.js?v=1.0.3">🌍 备用线路一 (v1.4)</button>
            <button class="line-btn" data-url="https://gcore.jsdelivr.net/gh/getaAAAs/test@main/1.3/app.js?v=1.0.3">🌍 备用线路二 (v1.3)</button>
            <p style="font-size:0.75rem; color:#888; margin-top:8px;">您也可以稍后刷新页面重试</p>
        </div>
        <button class="modal-close-btn" onclick="document.getElementById('lineModal').classList.remove('active')">关闭</button>
    </div>
</div>

<script>
    // 所有线路按优先级排列，加载时会自动依次回退
    const APP_SOURCES = [
        "https://cdn.jsdelivr.net/gh/getaAAAs/test@main/1.3/app.js?v=1.0.3",
        "https://cdn.jsdelivr.net/gh/getaAAAs/test@main/1.4/app.js?v=1.0.4",
        "https://fastly.jsdelivr.net/gh/getaAAAs/test@main/1.3/app.js?v=1.0.3",
        "https://gcore.jsdelivr.net/gh/getaAAAs/test@main/1.3/app.js?v=1.0.3"
    ];

    const loadingOverlay = document.getElementById('loadingOverlay');
    const lineModal = document.getElementById('lineModal');

    function loadScript(url, timeout = 10000) {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = url;
            script.async = true;

            // 只在“既没成功也没报错”的卡住场景下，超时才兜底
            const timer = setTimeout(() => {
                cleanup();
                script.remove();
                reject(new Error('加载超时: ' + url));
            }, timeout);

            function cleanup() {
                clearTimeout(timer);
                script.onload = null;
                script.onerror = null;
            }

            script.onload = () => {
                cleanup();
                resolve(url);
            };

            script.onerror = () => {
                cleanup();
                script.remove();
                reject(new Error('加载失败: ' + url));
            };

            document.head.appendChild(script);
        });
    }

    // 脚本加载后统一检查核心函数
    function tryInit() {
        if (typeof initApp === 'function') {
            initApp();
            return true;
        }
        return false;
    }

    async function tryLoadApp() {
        loadingOverlay.style.display = 'flex';

        for (const url of APP_SOURCES) {
            try {
                await loadScript(url);
                if (tryInit()) {
                    console.log('✅ 成功加载并初始化:', url);
                    return;
                }
                console.warn('⚠️ 脚本已加载但缺少 initApp:', url);
            } catch (e) {
                console.warn(e.message || e);
            }
        }

        // 所有线路都失败才弹窗
        loadingOverlay.style.display = 'none';
        lineModal.classList.add('active');
    }

    // 手动兜底按钮
    document.querySelectorAll('.line-btn').forEach(btn => {
        btn.addEventListener('click', async function () {
            const url = this.dataset.url;
            lineModal.classList.remove('active');
            loadingOverlay.style.display = 'flex';

            try {
                await loadScript(url);
                if (tryInit()) {
                    return;
                }
                throw new Error('app.js 未正确初始化');
            } catch (e) {
                console.warn(e.message || e);
                loadingOverlay.style.display = 'none';
                alert('该线路加载失败，请尝试其他线路或检查网络。');
                lineModal.classList.add('active');
            }
        });
    });

    tryLoadApp();
</script>
</body>
</html>
